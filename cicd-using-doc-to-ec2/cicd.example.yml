name: Ecommerce CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20
  PNPM_VERSION: 10

jobs:
  # ---------------------------------------------------------------------
  # Runs on every push AND every PR. Uses throwaway/dummy values — this
  # never touches production data or production secrets.
  # ---------------------------------------------------------------------
  test:
    name: Lint, typecheck, build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEXTAUTH_SECRET: ci-placeholder-secret
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: ${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}

      - name: Test
        run: pnpm test
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

  # ---------------------------------------------------------------------
  # Only runs on an actual push to main (never on a PR). Builds the real
  # production image ONCE and pushes it to Docker Hub, tagged with both
  # `latest` and the commit SHA so a specific build can always be re-pulled.
  # ---------------------------------------------------------------------
  docker:
    name: Build & push Docker image
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            jaldabir/ecommerce-app:latest
            jaldabir/ecommerce-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Only NEXT_PUBLIC_* — these are the only values that actually
          # need to be correct at build time, since they get compiled into
          # the client bundle. Nothing server-only goes here.
          build-args: |
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET=${{ secrets.NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ secrets.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME }}

      - name: Verify pushed image
        run: docker pull jaldabir/ecommerce-app:${{ github.sha }}

  # ---------------------------------------------------------------------
  # Deploys to EC2. Never builds anything — only pulls the image that the
  # `docker` job already pushed, then restarts the container with it.
  # ---------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    needs: docker
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production   # optional: enables required-reviewer gates in repo settings

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # docker-compose.yml lives in the repo and is copied over on every
      # deploy so the server always matches main. The real secrets stay in
      # the .env file that already lives on the instance — never touched here.
      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: docker-compose.yml
          target: ~/ecommerce-app

      - name: Pull latest image and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/ecommerce-app
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

            # Pin this deploy to the exact commit that was just built —
            # this is what makes rollback possible (redeploy an old SHA).
            export IMAGE_TAG=${{ github.sha }}

            docker compose pull app
            docker compose up -d --remove-orphans

            # Basic health check before cleaning up the old image
            sleep 5
            curl -fsS http://localhost:3000 > /dev/null || (docker compose logs --tail=50 app && exit 1)

            docker image prune -f