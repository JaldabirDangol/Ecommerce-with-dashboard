# Deployed to EC2 only — never used for local development. This file never
# builds; it always pulls the image that GitHub Actions already built and
# pushed to Docker Hub in the `docker` job of cicd.yml.
#
# Real runtime secrets (DATABASE_URL, NEXTAUTH_SECRET, STRIPE_SECRET_KEY,
# CLOUDINARY_API_SECRET, etc.) live in the .env file next to this file on
# the EC2 instance ONLY. That .env file is never created or touched by CI —
# it's managed by hand (or via a secrets manager) directly on the server.
#
# IMAGE_TAG is exported by the deploy step over SSH (see cicd.yml) so each
# deploy pins the exact commit SHA that was just built and tested — this is
# what makes rollback possible (redeploy an older SHA). "latest" is only a
# fallback for a manual `docker compose up` run on the server.
#
# For local development, use docker-compose.yml instead — it builds from
# source and reads its env vars from the local .env file.

services:
  app:
    image: jaldabir/ecommerce-app:${IMAGE_TAG:-latest}
    container_name: ecommerce-app
    restart: unless-stopped
    ports:
      - "3003:3000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
